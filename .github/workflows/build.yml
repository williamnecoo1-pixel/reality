name: Build CF-Only Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-cf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Shadowsocks client
        run: |
          sudo apt-get update
          sudo apt-get install -y shadowsocks-libev curl
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install v2ray-plugin
        run: |
          go install github.com/shadowsocks/v2ray-plugin@latest
          v2ray-plugin -version || true
          ss-local -h || true

      - name: Build SS-WS Configs
        run: node scripts/build.mjs

      - name: Commit generated subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh configs $(date -u +%FT%TZ)"
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-subscription
          path: dist/
          if-no-files-found: warn
