name: Check and Update Working SS Configs

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 500

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download Xray
        run: |
          XRAY_VERSION="v26.7.28"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -O xray.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray
          ./xray/xray version

      - name: Check configs
        run: python checker.py

      - name: Prepare subscription file
        if: always()
        run: |
          if [ -f working.txt ]; then
            mv working.txt working_configs.txt
          else
            touch working_configs.txt
          fi

      - name: Show result
        if: always()
        run: |
          echo "=============================="
          echo " WORKING SS CONFIGS"
          echo "=============================="
          echo "Count:"
          wc -l working_configs.txt
          echo
          echo "First configs:"
          head -n 10 working_configs.txt

      - name: Update repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working_configs.txt
          if git diff --cached --quiet; then
            echo "No changes in working_configs.txt"
          else
            git commit -m "Update working SS configs"
            git push
          fi

      - name: Upload working configs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: working-configs
          path: working_configs.txt
          if-no-files-found: error
